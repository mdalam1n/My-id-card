name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "SDK_URL=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" >> $GITHUB_ENV
          mkdir -p $HOME/android/sdk/cmdline-tools/latest
          wget -O sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q sdk.zip -d $HOME/android/sdk/cmdline-tools
          mv $HOME/android/sdk/cmdline-tools/cmdline-tools/* $HOME/android/sdk/cmdline-tools/latest/
          rm -rf $HOME/android/sdk/cmdline-tools/cmdline-tools/cmdline-tools sdk.zip

      - name: Set Android SDK Environment
        run: |
          echo "ANDROID_HOME=$HOME/android/sdk" >> $GITHUB_ENV
          echo "$HOME/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
